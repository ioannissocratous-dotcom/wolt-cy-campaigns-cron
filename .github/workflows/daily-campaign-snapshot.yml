name: Daily campaign snapshot (push to Boltable)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [daily-snapshot]

permissions:
  contents: read

concurrency:
  group: campaign-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve today's date (Cyprus)
        id: day
        run: |
          TODAY=$(TZ=Asia/Nicosia date +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "Cyprus date: $TODAY"

      - name: Skip if today's snapshot already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.BOLTABLE_REPO_TOKEN }}
        run: |
          TODAY="${{ steps.day.outputs.today }}"
          if gh api "repos/boltable/campaigns-diary/contents/snapshots/${TODAY}.json" &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot for ${TODAY} already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot for ${TODAY} yet — will fetch."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          repository: boltable/campaigns-diary
          token: ${{ secrets.BOLTABLE_REPO_TOKEN }}
          path: app

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'true'
        with:
          repository: boltable/campaigns-diary
          token: ${{ secrets.BOLTABLE_REPO_TOKEN }}
          path: app

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'true'
        with:
          python-version: "3.12"

      - name: Fetch campaigns (Wolt + Foody CY + Uber Eats PT/PL/KE) + render diary
        if: steps.check.outputs.skip != 'true'
        working-directory: app
        env:
          WOLT_ACCESS_TOKEN: ${{ secrets.WOLT_ACCESS_TOKEN }}
          WOLT_REFRESH_TOKEN: ${{ secrets.WOLT_REFRESH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAMPAIGN_DIARY_URL: https://campaigns-diary.boltable.eu
        run: bash run_campaign_ci.sh

      - name: Refresh competitors only (snapshot already exists for today)
        if: steps.check.outputs.skip == 'true'
        working-directory: app
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          python -u campaign_snapshot.py --competitors-only
          mkdir -p public
          cp preview/campaign-latest.html public/index.html
          cp preview/diary-manifest.json public/diary-manifest.json
          shopt -s nullglob
          for f in preview/campaign-[0-9]*.html; do
            cp "$f" public/
          done

      - name: Verify snapshot before push
        if: steps.check.outputs.skip != 'true'
        working-directory: app
        run: |
          TODAY="${{ steps.day.outputs.today }}"
          FILE="snapshots/${TODAY}.json"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: expected $FILE after fetch" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          today = os.environ["TODAY"]
          data = json.loads(Path(f"snapshots/{today}.json").read_text())
          if data.get("countries"):
              from campaign_countries import CAMPAIGN_COUNTRY_ORDER, MIN_EXPECTED_BANNERS
              for code in CAMPAIGN_COUNTRY_ORDER:
                  blob = data["countries"].get(code, {})
                  if not blob:
                      continue
                  count = blob.get("banner_count", 0)
                  min_expected = MIN_EXPECTED_BANNERS.get(code, 3)
                  print(f"{code} guest banner_count={count}")
                  if count < min_expected:
                      print(
                          f"ERROR: {code} snapshot has too few banners — refusing to publish",
                          file=sys.stderr,
                      )
                      sys.exit(1)
              cy = data["countries"].get("CY") or {}
              foody = (cy.get("platforms") or {}).get("foody") or {}
              foody_n = int(foody.get("banner_count") or 0)
              print(f"CY Foody hero banner_count={foody_n}")
              if foody_n < 1:
                  print(
                      "ERROR: CY Foody hero carousel missing — refusing to publish",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              pt = data["countries"].get("PT") or {}
              ue = (pt.get("platforms") or {}).get("uber_eats") or {}
              ue_n = int(ue.get("banner_count") or 0)
              print(f"PT Uber Eats promo banner_count={ue_n}")
              if ue_n < 1:
                  print(
                      "ERROR: PT Uber Eats promo carousel missing — refusing to publish",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              for code in ("PL", "KE"):
                  blob = data["countries"].get(code) or {}
                  ue = (blob.get("platforms") or {}).get("uber_eats") or {}
                  n = int(ue.get("banner_count") or 0)
                  print(f"{code} Uber Eats promo banner_count={n}")
                  if n < 1:
                      print(
                          f"ERROR: {code} Uber Eats promo carousel missing — refusing to publish",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          else:
              count = data.get("banner_count", 0)
              print(f"guest banner_count={count}")
              if count < 5:
                  print("ERROR: snapshot has too few banners — refusing to publish", file=sys.stderr)
                  sys.exit(1)
          PY
        env:
          TODAY: ${{ steps.day.outputs.today }}

      - name: Push snapshot to boltable repo (triggers Boltable deploy)
        if: steps.check.outputs.skip != 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.BOLTABLE_REPO_TOKEN }}
        run: |
          TODAY="${{ steps.day.outputs.today }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/*.json digests/*.json preview/campaign-*.html public/ campaign_city_registry.json 2>/dev/null || \
            git add snapshots/*.json preview/campaign-*.html public/ campaign_city_registry.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily campaign snapshot ${TODAY}"
          git push

      - name: Push competitor refresh to boltable repo
        if: steps.check.outputs.skip == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.BOLTABLE_REPO_TOKEN }}
        run: |
          TODAY="${{ steps.day.outputs.today }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/*.json preview/campaign-*.html public/
          if git diff --staged --quiet; then
            echo "No competitor changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh competitors ${TODAY}"
          git push
