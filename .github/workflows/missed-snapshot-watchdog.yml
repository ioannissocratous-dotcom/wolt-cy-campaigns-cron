name: Missed snapshot watchdog

on:
  schedule:
    # 13:15 UTC ≈ 16:15 Cyprus — final check; fails loudly if still missing
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Last-chance dispatch if snapshot still missing
        env:
          GH_TOKEN: ${{ github.token }}
          BOLTABLE_TOKEN: ${{ secrets.BOLTABLE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Nicosia date +%Y-%m-%d)
          if gh api "repos/boltable/wolt-cy-campaigns/contents/snapshots/${TODAY}.json" \
              --header "Authorization: Bearer ${BOLTABLE_TOKEN}" &>/dev/null; then
            echo "Snapshot for ${TODAY} exists — OK."
            exit 0
          fi
          echo "Still missing ${TODAY} at watchdog time — dispatching once more."
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-campaign-snapshot.yml/dispatches" \
            -f ref=main
          sleep 90
          if gh api "repos/boltable/wolt-cy-campaigns/contents/snapshots/${TODAY}.json" \
              --header "Authorization: Bearer ${BOLTABLE_TOKEN}" &>/dev/null; then
            echo "Snapshot created after watchdog dispatch."
            exit 0
          fi
          echo "ERROR: No snapshot for ${TODAY} after watchdog — check Actions logs and secrets." >&2
          exit 1
